# Validate the website and dependency updates without deploying or using secrets.
name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build-and-test:
        name: Build and test
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out source
              uses: actions/checkout@v7
              with:
                  # Git-based content dates need the same full history as Cloudflare builds.
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # No prebuild hook: the committed dist/ ships the plugin. Nothing here
            # compiles the plugin — npm ci installs it as a workspace dependency.

            # check = plugin typecheck + import guards + dist/ freshness + prettier;
            # test = root test suite. Both are fast and fail before the slower build.
            - name: Check types and formatting
              run: npm run check

            - name: Run tests
              run: npm test

            # The clean-checkout proof: npm ci + a plain site build must load and
            # render the committed plugin output without ever compiling the plugin.
            - name: Build website
              run: npm run build
